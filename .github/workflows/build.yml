name: Build APK

# COMPATIBILITY NOTE: this project's previous zip exports referenced this
# workflow in README.md but never actually included .github/workflows/ nor
# a working gradlew/gradlew.bat + gradle-wrapper.jar. That mismatch is the
# most likely reason past pushes needed repeated troubleshooting: there was
# no CI file for GitHub Actions to run at all. Rather than hand-crafting a
# gradle-wrapper.jar (a binary file that has to match Gradle's own
# checksums), this workflow uses the official gradle/actions/setup-gradle
# action to install Gradle 8.7 directly (matching gradle/wrapper/gradle-wrapper.properties)
# and invokes `gradle` instead of `./gradlew`. This needs no wrapper jar at
# all and is fully reproducible from a clean checkout every time.
#
# REQUIRES a repository secret named RELEASE_KEYSTORE_PASSWORD (Settings >
# Secrets and variables > Actions) matching the password release.keystore
# was last rotated to. Without it, the release build step will still run
# but produce an APK signed with a bogus fallback password that won't
# match any previously-installed build.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # Stale Run Guard (Anti-Desync): protects against GitHub's "Re-run
      # jobs" on an *old* workflow run after main has since moved forward.
      # actions/checkout@v4 above checks out the commit this specific run
      # was originally queued for ($GITHUB_SHA) — re-running it does NOT
      # re-resolve that to main's current tip. Without this guard, a stale
      # re-run would happily build+publish a GitHub Release from outdated
      # source, indistinguishable from a fresh release. Runs first, before
      # any build/signing/publish step, so a stale run aborts immediately
      # instead of burning CI minutes or risking a bad release.
      - name: Stale Run Guard (Anti-Desync)
        run: |
          CURRENT_MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "GITHUB_SHA (this run) : $GITHUB_SHA"
          echo "origin/main tip (now) : $CURRENT_MAIN_SHA"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Could not resolve origin/main's current tip via git ls-remote — aborting rather than risk publishing unverified."
            exit 1
          fi
          if [ "$GITHUB_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "::error::Stale run detected — this run's commit ($GITHUB_SHA) no longer matches origin/main's current tip ($CURRENT_MAIN_SHA). Likely a 'Re-run jobs' on an old workflow run after main has since moved forward. Aborting before build/release to prevent publishing an outdated APK. Push a new commit, or use 'Re-run all jobs' only on the LATEST run for main."
            exit 1
          fi
          echo "OK: commit matches origin/main's current tip — proceeding."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        id: build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          VERSION_CODE_OVERRIDE: ${{ github.run_number }}
        # Piped through `tee` so the full Gradle stdout/stderr is also saved
        # to a file, not just streamed to the Actions UI — that file is what
        # "Upload failure logs" below packages up. GitHub Actions' default
        # bash invocation runs with `pipefail`, so a failing `gradle` still
        # fails this step (and the job) even through the pipe.
        run: gradle assembleRelease --stacktrace --parallel --build-cache 2>&1 | tee build-output.log

      - name: Prepare failure log name
        if: failure()
        id: failinfo
        run: |
          # AUTOMATED VERSIONING (Batch 22): computed directly, matching
          # app/build.gradle.kts's `appVersionMajor` constant exactly — no
          # longer grepped from a hand-bumped literal in that file. If
          # appVersionMajor is ever deliberately bumped there, update the
          # "1" below to match (see the cross-reference comment at both
          # sites).
          VERSION_NAME="1.${GITHUB_RUN_NUMBER}"
          echo "log_name=log_fail_${VERSION_NAME}_${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Failed-build counterpart to "Upload APK artifact" below: whenever any
      # earlier step in this job fails (compile error, signing error, etc.),
      # this uploads the captured Gradle output plus any Gradle/lint report
      # files as a downloadable artifact named log_fail_<version>_<run
      # number> — so diagnosing a failure doesn't require GitHub's separate
      # "download log archive" UI export.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.failinfo.outputs.log_name }}
          path: |
            build-output.log
            **/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: warn

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          # AUTOMATED VERSIONING (Batch 22 — standing rule, see this repo's
          # PROJECT_STATE.md "Automated versioning rule"): computed directly
          # from $GITHUB_RUN_NUMBER, matching app/build.gradle.kts's
          # `appVersionMajor` constant exactly instead of grepping a
          # hand-bumped literal out of that file. Nothing here requires a
          # manual per-batch bump ever again — the ONLY manual constant left
          # in the whole scheme is `appVersionMajor` itself (deliberate
          # breaking/milestone bumps only, never routine), and if it's ever
          # changed the "1" below must be updated to match.
          VERSION_NAME="1.${GITHUB_RUN_NUMBER}"
          # Tag/filename still append -build<n> even though versionName
          # already embeds the run number — kept for exact backward
          # compatibility with AppUpdater.kt's `Regex("build(\\d+)")` tag
          # parser (Batch 21), so that file didn't need touching this batch.
          RELEASE_TAG="v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}"
          OUT_NAME="Vidsize-v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}-release.apk"
          echo "Versioned name: $OUT_NAME"
          cp "$APK_PATH" "$OUT_NAME"
          echo "apk_name=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error

      # GitHub Release Rule: the signed APK must be published as an actual
      # GitHub Release (visible in the repo's sidebar under "Releases"), not
      # just an Actions artifact — artifacts require being logged into
      # GitHub and navigating to a specific run, which isn't a good fit for
      # installing on a phone straight from the repo homepage. Tag comes
      # from steps.apk.outputs.release_tag (versionName + run number, see
      # the BUG FIX comment above), so every run gets its own release
      # instead of colliding with and overwriting a previous one.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.release_tag }}
          name: ${{ steps.apk.outputs.release_tag }}
          files: ${{ steps.apk.outputs.apk_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
