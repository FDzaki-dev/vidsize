# Build-speed tuning (see CHANGELOG.md, Batch 4) — this project has one
# module (:app), so most of the win here is: bigger daemon heap so the
# Compose compiler plugin doesn't GC-thrash, the build cache so unchanged
# tasks are skipped entirely on every push after the first, and a faster
# GC for the short-lived compile JVM. org.gradle.parallel matters less
# with a single module but costs nothing to leave on for when/if a second
# module is ever added.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
